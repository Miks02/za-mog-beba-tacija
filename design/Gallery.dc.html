<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Naše uspomene — Beba Tacije</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&amp;family=Great+Vibes&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#120A1F}
a{color:#D9C2FF}a:hover{color:#F3E8FF}
@keyframes bt-rise{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes bt-deal-l{0%{opacity:0;transform:translate(-40vw,50vh) rotate(-60deg) scale(.5)}70%{opacity:1}100%{opacity:1;transform:none}}
@keyframes bt-deal-r{0%{opacity:0;transform:translate(40vw,50vh) rotate(60deg) scale(.5)}70%{opacity:1}100%{opacity:1;transform:none}}
@keyframes bt-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bt-bulb{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes bt-up{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.7}100%{transform:translateY(-105vh) scale(1.1);opacity:0}}
@keyframes bt-fade{from{opacity:0}to{opacity:1}}
@keyframes bt-zoom-a{from{opacity:0;transform:scale(.6) rotate(-12deg)}to{opacity:1;transform:scale(1) rotate(-1.5deg)}}
@keyframes bt-zoom-b{from{opacity:0;transform:scale(.6) rotate(12deg)}to{opacity:1;transform:scale(1) rotate(-1.5deg)}}
@keyframes bt-draw{to{stroke-dashoffset:0}}
@keyframes bt-drift{from{transform:translate(0,0) scale(1)}to{transform:translate(5vw,4vh) scale(1.12)}}
.bt-rise{animation:bt-rise 1s cubic-bezier(.2,.7,.2,1) both}
.bt-deal{transition:z-index 0s}
.bt-deal:hover{z-index:30 !important}
.bt-deal-l{animation:bt-deal-l 1.3s cubic-bezier(.2,.8,.25,1) both}
.bt-deal-r{animation:bt-deal-r 1.3s cubic-bezier(.2,.8,.25,1) both}
.bt-bob{animation:bt-bob ease-in-out infinite}
.bt-pol{transition:transform .45s cubic-bezier(.34,1.45,.64,1),box-shadow .45s ease}
.bt-pol:hover{transform:rotate(0deg) scale(1.12) !important;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 3px rgba(232,180,240,.6) !important}
.bt-wire{stroke-dasharray:1800;stroke-dashoffset:1800;animation:bt-draw 2.2s ease-out both}
.bt-bulb{animation:bt-bulb 2.4s ease-in-out infinite both}
.bt-up{position:absolute;bottom:-30px;animation:bt-up linear infinite both}
.bt-overlay{animation:bt-fade .35s ease both}
.bt-zoom-a{animation:bt-zoom-a .7s cubic-bezier(.34,1.4,.64,1) both}
.bt-zoom-b{animation:bt-zoom-b .7s cubic-bezier(.34,1.4,.64,1) both}
.bt-glow{animation:bt-drift 18s ease-in-out infinite alternate}
.bt-ghost:hover{background-color:rgba(243,232,255,.16) !important}
</style>
</helmet>
<div style="position: relative; width: 100%; min-height: 100vh; overflow: hidden; background: #120A1F; color: #F3E8FF; font-family: 'Manrope', system-ui, sans-serif;">

  <div class="bt-glow" aria-hidden="true" style="position: absolute; width: 70vw; height: 70vw; left: 15vw; top: -10vw; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,0.3), rgba(139,92,246,0) 62%);"></div>

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none;">
    <sc-for list="{{floaters}}" as="f" hint-placeholder-count="8">
      <svg class="bt-up" viewBox="0 0 24 24" style="left: {{f.left}}; width: {{f.size}}; height: {{f.size}}; animation-duration: {{f.dur}}; animation-delay: {{f.delay}};"><path d="M12 21s-6.7-4.35-9.33-8.36C.9 9.9 2.2 6 5.8 5.2 8 4.7 10.2 5.7 12 7.6c1.8-1.9 4-2.9 6.2-2.4 3.6.8 4.9 4.7 3.13 7.44C18.7 16.65 12 21 12 21z" fill="#A77BFF" fill-opacity="0.45"/></svg>
    </sc-for>
  </div>

  <svg aria-hidden="true" viewBox="0 0 1440 110" preserveAspectRatio="xMidYMin slice" style="position: absolute; left: 0; top: 0; width: 100%; height: 110px; overflow: visible;">
    <path class="bt-wire" d="M-20 20 Q 360 110 720 30 Q 1080 110 1460 20" fill="none" stroke="#4E3B78" stroke-width="1.5"/>
    <g style="filter: drop-shadow(0 0 8px rgba(255,227,163,0.8));">
      <circle class="bt-bulb" cx="131" cy="57" r="5.5" fill="#FFE3A3" style="animation-delay: 0.2s;"/>
      <circle class="bt-bulb" cx="281" cy="73" r="5.5" fill="#E8B4F0" style="animation-delay: 0.9s;"/>
      <circle class="bt-bulb" cx="429" cy="75" r="5.5" fill="#C9A7FF" style="animation-delay: 1.5s;"/>
      <circle class="bt-bulb" cx="575" cy="63" r="5.5" fill="#F3E8FF" style="animation-delay: 0.5s;"/>
      <circle class="bt-bulb" cx="720" cy="38" r="5.5" fill="#FFE3A3" style="animation-delay: 1.2s;"/>
      <circle class="bt-bulb" cx="865" cy="63" r="5.5" fill="#E8B4F0" style="animation-delay: 1.8s;"/>
      <circle class="bt-bulb" cx="1011" cy="75" r="5.5" fill="#C9A7FF" style="animation-delay: 0.3s;"/>
      <circle class="bt-bulb" cx="1159" cy="73" r="5.5" fill="#F3E8FF" style="animation-delay: 1.1s;"/>
      <circle class="bt-bulb" cx="1309" cy="57" r="5.5" fill="#FFE3A3" style="animation-delay: 1.7s;"/>
    </g>
  </svg>

  <div style="position: relative; z-index: 1; box-sizing: border-box; width: 100%; max-width: 1280px; min-height: 100vh; margin: 0 auto; padding: clamp(24px, 3.4vw, 48px) clamp(24px, 4vw, 56px); display: flex; flex-direction: column; gap: 12px;">

    <header class="bt-rise" style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <a href="Home.dc.html" class="bt-ghost" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px 0 14px; border-radius: 999px; background: rgba(243,232,255,0.08); border: 1px solid rgba(243,232,255,0.16); color: #F3E8FF; text-decoration: none; font-size: 14px; font-weight: 600;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        <span>Nazad</span>
      </a>
      <span style="font-size: 13px; color: #B9A8D9;">Klikni na sliku da je otvoriš</span>
    </header>

    <h1 class="bt-rise" style="margin: 8px 0 0; text-align: center; font-family: 'Great Vibes', cursive; font-weight: 400; font-size: clamp(52px, 5.6vw, 84px); line-height: 1.1; color: #F3E8FF; text-shadow: 0 0 36px rgba(167,123,255,0.5); animation-delay: 0.3s;">Naše uspomene</h1>

    <div style="position: relative; flex: 1; width: 100%; min-height: 600px;">
      <sc-for list="{{photos}}" as="p" hint-placeholder-count="9">
        <div class="bt-deal {{p.deal}}" style="position: absolute; left: {{p.left}}; top: {{p.top}}; z-index: {{p.z}}; animation-delay: {{p.delay}};">
          <div class="bt-bob" style="animation-duration: {{p.bobDur}}; animation-delay: {{p.bobDelay}};">
            <button type="button" class="bt-pol" onClick="{{p.pick}}" aria-label="Otvori sliku {{p.n}}" style="position: relative; display: flex; flex-direction: column; gap: 8px; width: clamp(150px, 14vw, 196px); padding: 10px 10px 12px; border: none; border-radius: 3px; background: #FBF8FF; cursor: pointer; transform: rotate({{p.rot}}); box-shadow: 0 18px 44px rgba(0,0,0,0.5); font: inherit;">
              <sc-if value="{{p.tape}}" hint-placeholder-val="{{ false }}">
                <span aria-hidden="true" style="position: absolute; left: 50%; top: -11px; width: 74px; height: 22px; margin-left: -37px; background: rgba(232,180,240,0.6); transform: rotate(-4deg);"></span>
              </sc-if>
              <span style="display: grid; place-items: center; width: 100%; aspect-ratio: 1 / 1; background: linear-gradient(160deg, {{p.t1}}, {{p.t2}});">
                <span style="display: flex; flex-direction: column; align-items: center; gap: 6px; color: #F3E8FF;">
                  <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                  <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em;">FOTO {{p.n}}</span>
                </span>
              </span>
              <span style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 15px; color: #3A2160; text-align: center;">{{p.cap}}</span>
            </button>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{hasSel}}" hint-placeholder-val="{{ false }}">
    <div class="bt-overlay" role="dialog" aria-label="Uvećana slika" style="position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; gap: clamp(12px, 3vw, 40px); padding: 24px; box-sizing: border-box; background: rgba(12,6,22,0.84); backdrop-filter: blur(8px);">
      <button type="button" class="bt-ghost" onClick="{{close}}" aria-label="Zatvori" style="position: absolute; right: clamp(20px, 3vw, 44px); top: clamp(20px, 3vw, 44px); width: 48px; height: 48px; padding: 0; display: grid; place-items: center; border-radius: 50%; background: rgba(243,232,255,0.08); border: 1px solid rgba(243,232,255,0.2); color: #F3E8FF; cursor: pointer;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button type="button" class="bt-ghost" onClick="{{prev}}" aria-label="Prethodna slika" style="flex: none; width: 52px; height: 52px; padding: 0; display: grid; place-items: center; border-radius: 50%; background: rgba(243,232,255,0.08); border: 1px solid rgba(243,232,255,0.2); color: #F3E8FF; cursor: pointer;">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <figure class="{{zoomCls}}" style="margin: 0; display: flex; flex-direction: column; gap: 14px; width: min(500px, 70vw); padding: 16px 16px 22px; box-sizing: border-box; background: #FBF8FF; border-radius: 4px; box-shadow: 0 40px 100px rgba(0,0,0,0.6);">
        <div style="display: grid; place-items: center; width: 100%; aspect-ratio: 1 / 1; background: linear-gradient(160deg, {{sel.t1}}, {{sel.t2}});">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; color: #F3E8FF;">
            <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.14em;">FOTO {{sel.n}}</span>
          </div>
        </div>
        <figcaption style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px;">
          <span style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 22px; color: #2A1640;">{{sel.cap}}</span>
          <span style="font-size: 13px; font-weight: 700; color: #5A3D86; font-variant-numeric: tabular-nums;">{{sel.n}} / {{count}}</span>
        </figcaption>
      </figure>
      <button type="button" class="bt-ghost" onClick="{{next}}" aria-label="Sledeća slika" style="flex: none; width: 52px; height: 52px; padding: 0; display: grid; place-items: center; border-radius: 50%; background: rgba(243,232,255,0.08); border: 1px solid rgba(243,232,255,0.2); color: #F3E8FF; cursor: pointer;">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const seed = [
      ['3%', '4%', '-8deg', '#B79AF0', '#6D4BB8', '[naša prva slika]', true],
      ['21%', '0%', '5deg', '#E8B4F0', '#8B5CF6', '[omiljeni izlazak]', false],
      ['40%', '6%', '-3deg', '#C9A7FF', '#5E3FA6', '[putovanje]', true],
      ['59%', '0%', '7deg', '#F0C6F3', '#A77BFF', '[smešan trenutak]', false],
      ['78%', '5%', '-6deg', '#A98BE8', '#4A2580', '[tvoj osmeh]', true],
      ['9%', '50%', '6deg', '#E8B4F0', '#6D4BB8', '[mi dvoje]', false],
      ['29%', '46%', '-7deg', '#C9A7FF', '#8B5CF6', '[zalazak sunca]', true],
      ['50%', '52%', '4deg', '#B79AF0', '#5E3FA6', '[rođendan]', false],
      ['70%', '48%', '-4deg', '#F0C6F3', '#7A56C2', '[naše mesto]', true]
    ];
    const sel = this.state && typeof this.state.sel === 'number' ? this.state.sel : -1;
    const flips = (this.state && this.state.flips) || 0;
    const photos = seed.map((s, i) => ({
      n: i + 1,
      left: s[0], top: s[1], rot: s[2], t1: s[3], t2: s[4], cap: s[5], tape: s[6],
      z: i < 5 ? 1 : 2,
      deal: i % 2 ? 'bt-deal-r' : 'bt-deal-l',
      delay: (0.4 + i * 0.14).toFixed(2) + 's',
      bobDur: (5 + (i % 4) * 0.8).toFixed(1) + 's',
      bobDelay: (-(i * 0.7)).toFixed(1) + 's',
      pick: () => this.setState({ sel: i, flips: flips + 1 })
    }));
    const floaters = [[6, 14, 16, 0], [18, 10, 20, 4], [33, 18, 18, 8], [47, 12, 22, 2], [61, 16, 17, 10], [74, 10, 21, 6], [86, 14, 19, 12], [94, 12, 23, 3]]
      .map((f) => ({ left: f[0] + '%', size: f[1] + 'px', dur: f[2] + 's', delay: f[3] + 's' }));
    const go = (d) => () => this.setState({ sel: (sel + d + seed.length) % seed.length, flips: flips + 1 });
    return {
      photos,
      floaters,
      hasSel: sel >= 0,
      sel: sel >= 0 ? photos[sel] : photos[0],
      count: seed.length,
      zoomCls: flips % 2 ? 'bt-zoom-a' : 'bt-zoom-b',
      close: () => this.setState({ sel: -1 }),
      prev: go(-1),
      next: go(1)
    };
  }
}
</script>
</body>
</html>
