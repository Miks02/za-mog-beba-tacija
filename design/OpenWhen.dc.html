<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Otvori kad… — Beba Tacije</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&amp;family=Great+Vibes&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#120A1F}
a{color:#D9C2FF}a:hover{color:#F3E8FF}
@keyframes bt-rise{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes bt-deal{0%{opacity:0;transform:translateY(60px) rotate(var(--r,-8deg)) scale(.8)}100%{opacity:1;transform:none}}
@keyframes bt-seal{0%,100%{box-shadow:0 0 0 0 rgba(232,180,240,.5)}50%{box-shadow:0 0 0 10px rgba(232,180,240,0)}}
@keyframes bt-ray{0%{transform:translateY(0) scale(.3);opacity:0}20%{opacity:1}100%{transform:translateY(-150px) scale(1);opacity:0}}
@keyframes bt-drift{from{transform:translate(0,0) scale(1)}to{transform:translate(5vw,4vh) scale(1.12)}}
@keyframes bt-twinkle{0%,100%{opacity:.12;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
.bt-rise{animation:bt-rise 1s cubic-bezier(.2,.7,.2,1) both}
.bt-deal{animation:bt-deal 1s cubic-bezier(.2,.8,.25,1) both}
.bt-cardbtn{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.bt-cardbtn:hover{transform:translateY(-6px)}
.bt-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,1.35,.45,1)}
.bt-flipped{transform:rotateY(180deg)}
.bt-face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.bt-back{transform:rotateY(180deg)}
.bt-seal{animation:bt-seal 2.4s ease-in-out infinite}
.bt-ray{position:absolute;left:50%;top:50%;width:0;height:0}
.bt-ray-in{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;animation:bt-ray 1.1s cubic-bezier(.15,.7,.3,1) both}
.bt-glow{animation:bt-drift 18s ease-in-out infinite alternate}
.bt-spark{border-radius:50%;background:#F3E8FF;box-shadow:0 0 10px 2px rgba(232,180,240,.7);animation:bt-twinkle 3.4s ease-in-out infinite both}
.bt-ghost:hover{background-color:rgba(243,232,255,.14) !important}
</style>
</helmet>
<div style="position: relative; width: 100%; min-height: 100vh; overflow: hidden; background: #120A1F; color: #F3E8FF; font-family: 'Manrope', system-ui, sans-serif;">

  <div class="bt-glow" aria-hidden="true" style="position: absolute; width: 64vw; height: 64vw; left: 18vw; top: -36vw; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,0.34), rgba(139,92,246,0) 65%);"></div>
  <div class="bt-glow" aria-hidden="true" style="position: absolute; width: 50vw; height: 50vw; right: -18vw; bottom: -26vw; border-radius: 50%; background: radial-gradient(circle, rgba(229,155,234,0.2), rgba(229,155,234,0) 65%); animation-delay: -5s;"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0;">
    <sc-for list="{{sparks}}" as="s" hint-placeholder-count="10">
      <div class="bt-spark" style="position: absolute; {{s.style}}"></div>
    </sc-for>
  </div>

  <div style="position: relative; z-index: 1; box-sizing: border-box; width: 100%; max-width: 1180px; min-height: 100vh; margin: 0 auto; padding: clamp(24px, 3.4vw, 48px) clamp(24px, 4vw, 56px); display: flex; flex-direction: column; gap: 18px;">

    <header class="bt-rise" style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <a href="Home.dc.html" class="bt-ghost" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px 0 14px; border-radius: 999px; background: rgba(243,232,255,0.08); border: 1px solid rgba(243,232,255,0.16); color: #F3E8FF; text-decoration: none; font-size: 14px; font-weight: 600;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        <span>Nazad</span>
      </a>
      <span style="font-size: 13px; font-weight: 600; color: #B9A8D9; font-variant-numeric: tabular-nums;">Otvoreno {{openCount}} od {{total}}</span>
    </header>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;">
      <h1 class="bt-rise" style="margin: 0; font-family: 'Great Vibes', cursive; font-weight: 400; font-size: clamp(54px, 5.8vw, 88px); line-height: 1.1; color: #F3E8FF; text-shadow: 0 0 36px rgba(167,123,255,0.5); animation-delay: 0.2s;">Otvori kad…</h1>
      <p class="bt-rise" style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 18px; color: #CDBFEA; animation-delay: 0.35s;">Za svaki trenutak kad ti zatreba malo mene.</p>
    </div>

    <div style="flex: 1; display: grid; align-content: center; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 22px; padding-top: 10px;">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
        <div class="bt-deal" style="position: relative; animation-delay: {{c.delay}};">
          <button type="button" class="bt-cardbtn" onClick="{{c.toggle}}" aria-pressed="{{c.open}}" aria-label="Otvori kad {{c.label}}" style="display: block; width: 100%; height: 232px; padding: 0; border: none; background: transparent; perspective: 1200px; cursor: pointer; font: inherit; color: inherit; text-align: left;">
            <div class="{{c.inner}}">
              <div class="bt-face" style="background: #5E3FA6; box-shadow: 0 22px 50px rgba(0,0,0,0.45);">
                <div style="position: absolute; inset: 0; background: #7A56C2; clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);"></div>
                <div style="position: absolute; left: 0; top: 0; width: 100%; height: 50%; background: #8C68D4; clip-path: polygon(0 0, 100% 0, 50% 100%);"></div>
                <div class="bt-seal" style="position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; display: grid; place-items: center; border-radius: 50%; background: #3E1D73; border: 2px solid #C9A7FF;">
                  <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.33-8.36C.9 9.9 2.2 6 5.8 5.2 8 4.7 10.2 5.7 12 7.6c1.8-1.9 4-2.9 6.2-2.4 3.6.8 4.9 4.7 3.13 7.44C18.7 16.65 12 21 12 21z" fill="#F3E8FF"/></svg>
                </div>
                <div style="position: absolute; left: 0; right: 0; bottom: 18px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; padding: 0 16px;">
                  <span style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #E4D6FF;">Otvori kad</span>
                  <span style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 22px; line-height: 1.2; color: #FFFFFF;">{{c.label}}</span>
                </div>
              </div>
              <div class="bt-face bt-back" style="background: #F6F0FF; box-shadow: 0 22px 50px rgba(0,0,0,0.45); padding: 22px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;">
                <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #6B4E96;">kad {{c.label}}</span>
                <span style="flex: 1; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 19px; line-height: 1.45; color: #2A1640; text-wrap: pretty;">{{c.msg}}</span>
                <span style="align-self: flex-end; font-family: 'Great Vibes', cursive; font-size: 30px; line-height: 1; color: #4A2580;">tvoj Milan</span>
              </div>
            </div>
          </button>
          <sc-if value="{{c.open}}" hint-placeholder-val="{{ false }}">
            <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none;">
              <sc-for list="{{rays}}" as="r" hint-placeholder-count="10">
                <div class="bt-ray" style="transform: rotate({{r.angle}});"><span class="bt-ray-in" style="background: {{r.color}}; box-shadow: 0 0 10px {{r.color}}; animation-delay: {{r.delay}};"></span></div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      ['ti nedostajem', 'Zatvori oči i zamisli moj zagrljaj. Upravo sada mislim na tebe.'],
      ['si tužna', 'I najteži dani prođu. A ja sam uz tebe u svakom od njih.'],
      ['ne možeš da zaspiš', 'Diši polako i zamisli da ti pričam o svom danu dok ti ne utonu oči.'],
      ['ti treba osmeh', 'Seti se kako smo se smejali bez razloga. Sad se smeješ, zar ne?'],
      ['sumnjaš u sebe', 'Ti si najjača i najpametnija osoba koju znam. Verujem u tebe, uvek.'],
      ['želiš da znaš koliko te volim', 'Više nego što stane u ovaj računar. I svaki dan malo više.']
    ];
    const open = (this.state && this.state.open) || {};
    const cards = items.map((it, i) => ({
      label: it[0],
      msg: it[1],
      open: !!open[i],
      inner: open[i] ? 'bt-inner bt-flipped' : 'bt-inner',
      delay: (0.4 + i * 0.12).toFixed(2) + 's',
      toggle: () => this.setState({ open: Object.assign({}, open, { [i]: !open[i] }) })
    }));
    const rays = Array.from({ length: 10 }, (_, k) => ({
      angle: (k * 36) + 'deg',
      color: ['#F3E8FF', '#E8B4F0', '#C9A7FF', '#FFE3A3'][k % 4],
      delay: (0.25 + (k % 3) * 0.05).toFixed(2) + 's'
    }));
    const sparkSeed = [
      [8, 10, 0.3, 3], [14, 40, 1.6, 2], [6, 70, 0.9, 2], [12, 90, 2.2, 3], [88, 6, 2.7, 2],
      [92, 34, 1.2, 2], [86, 62, 0.5, 3], [90, 88, 2.0, 2], [50, 2, 1.4, 3], [44, 97, 2.5, 2]
    ];
    const sparks = sparkSeed.map((s) => ({
      style: 'top: ' + s[0] + '%; left: ' + s[1] + '%; width: ' + s[3] + 'px; height: ' + s[3] + 'px; animation-delay: ' + s[2] + 's;'
    }));
    return {
      cards,
      rays,
      sparks,
      total: items.length,
      openCount: cards.filter((c) => c.open).length
    };
  }
}
</script>
</body>
</html>
