<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Naše nebo — Beba Tacije</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&amp;family=Great+Vibes&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0B0616}
a{color:#D9C2FF}a:hover{color:#F3E8FF}
@keyframes bt-rise{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes bt-twinkle{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes bt-draw{to{stroke-dashoffset:0}}
@keyframes bt-pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.6);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes bt-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bt-halo{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes bt-shoot{0%{transform:rotate(25deg) translateX(0);opacity:0}2%{opacity:1}9%{transform:rotate(25deg) translateX(760px);opacity:0}100%{transform:rotate(25deg) translateX(760px);opacity:0}}
@keyframes bt-wish-a{0%{transform:rotate(28deg) translateX(0);opacity:0}8%{opacity:1}100%{transform:rotate(28deg) translateX(900px);opacity:0}}
@keyframes bt-wish-b{0%{transform:rotate(28deg) translateX(0);opacity:0}8%{opacity:1}100%{transform:rotate(28deg) translateX(900px);opacity:0}}
@keyframes bt-moon{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.bt-rise{animation:bt-rise 1s cubic-bezier(.2,.7,.2,1) both}
.bt-star{position:absolute;border-radius:50%;background:#F3E8FF;animation:bt-twinkle ease-in-out infinite both}
.bt-cline{stroke-dasharray:1700;stroke-dashoffset:1700;animation:bt-draw 4.6s 1s cubic-bezier(.45,.05,.55,.95) both}
.bt-cstar{transform-box:fill-box;transform-origin:50% 50%;animation:bt-pop .7s cubic-bezier(.34,1.6,.64,1) both}
.bt-halo{animation:bt-halo 3s 6s ease-in-out infinite both}
.bt-late{animation:bt-fade 1.4s cubic-bezier(.2,.7,.2,1) both}
.bt-shoot{position:absolute;width:170px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(243,232,255,0),#F3E8FF);box-shadow:0 0 8px rgba(232,180,240,.8);transform-origin:0 50%;animation:bt-shoot linear infinite both}
.bt-wish-a .bt-w{animation:bt-wish-a 1.6s cubic-bezier(.3,.6,.4,1) both}
.bt-wish-b .bt-w{animation:bt-wish-b 1.6s cubic-bezier(.3,.6,.4,1) both}
.bt-w{position:absolute;width:220px;height:2.5px;border-radius:2px;background:linear-gradient(90deg,rgba(255,227,163,0),#FFE3A3);box-shadow:0 0 10px rgba(255,227,163,.9);transform-origin:0 50%;opacity:0}
.bt-moon{animation:bt-moon 9s ease-in-out infinite}
.bt-btn{transition:transform .2s ease,box-shadow .2s ease}
.bt-btn:hover{transform:translateY(-2px);box-shadow:0 16px 50px rgba(255,227,163,.35) !important}
.bt-btn:active{transform:scale(.97)}
.bt-ghost:hover{background-color:rgba(243,232,255,.14) !important}
@media (prefers-reduced-motion: reduce){.bt-shoot{animation:none;opacity:0}}
</style>
</helmet>
<div style="position: relative; width: 100%; min-height: 100vh; overflow: hidden; background: radial-gradient(ellipse at 50% 120%, #2A1450 0%, #160B2B 45%, #0B0616 100%); color: #F3E8FF; font-family: 'Manrope', system-ui, sans-serif;">

  <div aria-hidden="true" style="position: absolute; inset: 0;">
    <sc-for list="{{stars}}" as="s" hint-placeholder-count="40">
      <span class="bt-star" style="top: {{s.top}}; left: {{s.left}}; width: {{s.size}}; height: {{s.size}}; animation-duration: {{s.dur}}; animation-delay: {{s.delay}}; box-shadow: 0 0 {{s.glow}} rgba(232,180,240,0.8);"></span>
    </sc-for>
    <span class="bt-shoot" style="top: 8%; left: 6%; animation-duration: 9s; animation-delay: 2s;"></span>
    <span class="bt-shoot" style="top: 4%; left: 48%; animation-duration: 13s; animation-delay: 6s;"></span>
    <span class="bt-shoot" style="top: 22%; left: 22%; animation-duration: 11s; animation-delay: 9.5s;"></span>
  </div>

  <div class="bt-moon" aria-hidden="true" style="position: absolute; right: 9%; top: 12%; width: 84px; height: 84px; border-radius: 50%; box-shadow: 18px -10px 0 0 #F3E8FF; filter: drop-shadow(0 0 22px rgba(243,232,255,0.55));"></div>

  <div class="{{wishCls}}" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none;">
    <span class="bt-w" style="top: 10%; left: 4%;"></span>
    <span class="bt-w" style="top: 4%; left: 30%; animation-delay: 0.18s;"></span>
    <span class="bt-w" style="top: 16%; left: 52%; animation-delay: 0.32s;"></span>
    <span class="bt-w" style="top: 2%; left: 66%; animation-delay: 0.45s;"></span>
    <span class="bt-w" style="top: 26%; left: 14%; animation-delay: 0.6s;"></span>
  </div>

  <div style="position: relative; z-index: 1; box-sizing: border-box; width: 100%; max-width: 1280px; min-height: 100vh; margin: 0 auto; padding: clamp(24px, 3.4vw, 48px) clamp(24px, 4vw, 56px); display: flex; flex-direction: column; gap: 8px;">

    <header class="bt-rise" style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <a href="Home.dc.html" class="bt-ghost" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px 0 14px; border-radius: 999px; background: rgba(243,232,255,0.08); border: 1px solid rgba(243,232,255,0.16); color: #F3E8FF; text-decoration: none; font-size: 14px; font-weight: 600;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        <span>Nazad</span>
      </a>
    </header>

    <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;">
      <h1 class="bt-rise" style="margin: 0; font-family: 'Great Vibes', cursive; font-weight: 400; font-size: clamp(48px, 5vw, 72px); line-height: 1.1; color: #F3E8FF; text-shadow: 0 0 36px rgba(167,123,255,0.55); animation-delay: 0.2s;">Naše nebo</h1>

      <svg viewBox="0 0 600 520" role="img" aria-label="Sazvežđe u obliku srca sa inicijalima M i T" style="width: min(500px, 82vw); height: auto; overflow: visible;">
        <path class="bt-halo" d="M300 150 L240 92 L165 92 L115 150 L118 225 L170 300 L235 365 L300 425 L365 365 L430 300 L482 225 L485 150 L435 92 L360 92 Z" fill="#8B5CF6" fill-opacity="0.12" stroke="#C9A7FF" stroke-opacity="0.35" stroke-width="10" stroke-linejoin="round" style="filter: blur(8px);"/>
        <path class="bt-cline" d="M300 150 L240 92 L165 92 L115 150 L118 225 L170 300 L235 365 L300 425 L365 365 L430 300 L482 225 L485 150 L435 92 L360 92 L300 150" fill="none" stroke="#E4D6FF" stroke-opacity="0.75" stroke-width="1.4" stroke-linejoin="round"/>
        <g fill="#F3E8FF" style="filter: drop-shadow(0 0 6px rgba(232,180,240,1));">
          <circle class="bt-cstar" cx="300" cy="150" r="5" style="animation-delay: 1s;"/>
          <circle class="bt-cstar" cx="240" cy="92" r="3.5" style="animation-delay: 1.3s;"/>
          <circle class="bt-cstar" cx="165" cy="92" r="4.5" style="animation-delay: 1.6s;"/>
          <circle class="bt-cstar" cx="115" cy="150" r="3.5" style="animation-delay: 1.9s;"/>
          <circle class="bt-cstar" cx="118" cy="225" r="4" style="animation-delay: 2.2s;"/>
          <circle class="bt-cstar" cx="170" cy="300" r="3.5" style="animation-delay: 2.5s;"/>
          <circle class="bt-cstar" cx="235" cy="365" r="4" style="animation-delay: 2.85s;"/>
          <circle class="bt-cstar" cx="300" cy="425" r="6" fill="#FFE3A3" style="animation-delay: 3.2s;"/>
          <circle class="bt-cstar" cx="365" cy="365" r="4" style="animation-delay: 3.55s;"/>
          <circle class="bt-cstar" cx="430" cy="300" r="3.5" style="animation-delay: 3.9s;"/>
          <circle class="bt-cstar" cx="482" cy="225" r="4" style="animation-delay: 4.2s;"/>
          <circle class="bt-cstar" cx="485" cy="150" r="3.5" style="animation-delay: 4.5s;"/>
          <circle class="bt-cstar" cx="435" cy="92" r="4.5" style="animation-delay: 4.8s;"/>
          <circle class="bt-cstar" cx="360" cy="92" r="3.5" style="animation-delay: 5.1s;"/>
        </g>
        <g class="bt-late" style="animation-delay: 5.6s;">
          <text x="300" y="268" text-anchor="middle" style="font-family: 'Great Vibes', cursive; font-size: 82px; fill: #F3E8FF;">M &amp; T</text>
          <text x="300" y="312" text-anchor="middle" style="font-family: 'Manrope', system-ui, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.28em; fill: #CDBFEA;">9 · 6 · 2025</text>
        </g>
      </svg>

      <p class="bt-late" style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: clamp(18px, 1.6vw, 22px); color: #E4D6FF; animation-delay: 6.2s;">Ispod istog neba, od prve noći.</p>

      <div class="bt-late" style="display: flex; flex-direction: column; align-items: center; gap: 12px; min-height: 86px; animation-delay: 6.6s;">
        <button type="button" class="bt-btn" onClick="{{wish}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 26px; border: none; border-radius: 999px; background: #FFE3A3; color: #2A1247; font-family: 'Manrope', system-ui, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 12px 40px rgba(255,227,163,0.25);">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#2A1247"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
          <span>Zaželi želju</span>
        </button>
        <sc-if value="{{wished}}" hint-placeholder-val="{{ false }}">
          <span aria-live="polite" class="{{msgCls}}" style="font-size: 14px; color: #CDBFEA;">Želja je poslata zvezdama.</span>
        </sc-if>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const stars = Array.from({ length: 90 }, () => {
      const big = rnd() > 0.85;
      const size = big ? 2.5 + rnd() * 1.2 : 1 + rnd() * 1.2;
      return {
        top: (rnd() * 100).toFixed(2) + '%',
        left: (rnd() * 100).toFixed(2) + '%',
        size: size.toFixed(1) + 'px',
        glow: big ? '8px' : '3px',
        dur: (2.4 + rnd() * 4).toFixed(1) + 's',
        delay: (-rnd() * 6).toFixed(1) + 's'
      };
    });
    const wishes = (this.state && this.state.wishes) || 0;
    return {
      stars,
      wished: wishes > 0,
      wishCls: wishes === 0 ? '' : (wishes % 2 ? 'bt-wish-a' : 'bt-wish-b'),
      msgCls: wishes % 2 ? 'bt-late' : 'bt-rise',
      wish: () => this.setState({ wishes: wishes + 1 })
    };
  }
}
</script>
</body>
</html>
