<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Pismo za tebe — Beba Tacije</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&amp;family=Great+Vibes&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#120A1F}
a{color:#D9C2FF}a:hover{color:#F3E8FF}
@keyframes bt-rise{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes bt-float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}
@keyframes bt-flap-open{0%{transform:rotateX(0deg)}100%{transform:rotateX(178deg)}}
@keyframes bt-env-out{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(90px) scale(.9)}}
@keyframes bt-letter-in{0%{opacity:0;transform:translateY(120px) scale(.86) rotate(-3deg)}60%{opacity:1}100%{opacity:1;transform:translateY(0) scale(1) rotate(-.6deg)}}
@keyframes bt-line{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes bt-seal{0%,100%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 0 0 rgba(232,180,240,.55)}50%{transform:translate(-50%,-50%) scale(1.06);box-shadow:0 0 0 14px rgba(232,180,240,0)}}
@keyframes bt-drift{from{transform:translate(0,0) scale(1)}to{transform:translate(5vw,4vh) scale(1.12)}}
.bt-rise{animation:bt-rise 1s cubic-bezier(.2,.7,.2,1) both}
.bt-env-idle{animation:bt-float 5s ease-in-out infinite}
.bt-env-gone{animation:bt-env-out .7s .85s cubic-bezier(.5,0,.75,0) both;pointer-events:none}
.bt-flap{transform-origin:50% 0;backface-visibility:visible}
.bt-flap-open{animation:bt-flap-open .85s cubic-bezier(.6,.05,.3,1) both}
.bt-seal{animation:bt-seal 2.2s ease-in-out infinite}
.bt-letter{animation:bt-letter-in 1.2s 1.05s cubic-bezier(.2,.8,.2,1) both}
.bt-line{animation:bt-line .9s cubic-bezier(.2,.7,.2,1) both}
.bt-glow{animation:bt-drift 18s ease-in-out infinite alternate}
.bt-back:hover{background-color:rgba(243,232,255,.14) !important}
.bt-close:hover{background-color:rgba(74,37,128,.14) !important}
</style>
</helmet>
<div style="position: relative; width: 100%; min-height: 100vh; overflow: hidden; background: #120A1F; color: #F3E8FF; font-family: 'Manrope', system-ui, sans-serif;">

  <div class="bt-glow" aria-hidden="true" style="position: absolute; width: 70vw; height: 70vw; left: 15vw; top: -20vw; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,0.32), rgba(139,92,246,0) 62%);"></div>

  <div style="position: relative; z-index: 1; box-sizing: border-box; width: 100%; max-width: 1280px; min-height: 100vh; margin: 0 auto; padding: clamp(24px, 4vw, 56px); display: flex; flex-direction: column; gap: 24px;">

    <header class="bt-rise" style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <a href="Home.dc.html" class="bt-back" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px 0 14px; border-radius: 999px; background: rgba(243,232,255,0.08); border: 1px solid rgba(243,232,255,0.16); color: #F3E8FF; text-decoration: none; font-size: 14px; font-weight: 600;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        <span>Nazad</span>
      </a>
      <span style="font-family: 'Great Vibes', cursive; font-size: 30px; line-height: 1; color: #E4D6FF;">Beba Tacije</span>
    </header>

    <main style="flex: 1; display: grid; place-items: center; padding: 8px 0 24px;">
      <div style="display: grid; place-items: center; width: 100%;">

        <div class="{{envCls}}" style="grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; gap: 28px;">
          <div style="position: relative; width: min(560px, 86vw); aspect-ratio: 16 / 10; perspective: 1400px;">
            <div style="position: absolute; inset: 0; border-radius: 16px; background: #5E3FA6; box-shadow: 0 34px 90px rgba(0,0,0,0.5);"></div>
            <div style="position: absolute; left: 7%; right: 7%; top: 8%; height: 70%; border-radius: 6px; background: #F6F0FF;"></div>
            <div style="position: absolute; inset: 0; border-radius: 16px; background: #7A56C2; clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%);"></div>
            <div class="{{flapCls}}" style="position: absolute; left: 0; top: 0; width: 100%; height: 56%; background: #8C68D4; border-radius: 16px 16px 0 0; clip-path: polygon(0 0, 100% 0, 50% 100%);"></div>
            <div style="position: absolute; left: 0; right: 0; bottom: 9%; text-align: center; font-family: 'Great Vibes', cursive; font-size: clamp(30px, 4vw, 42px); line-height: 1; color: #F3E8FF;">za Beba Tacije</div>
            <sc-if value="{{closed}}" hint-placeholder-val="{{ true }}">
              <button type="button" class="bt-seal" onClick="{{open}}" aria-label="Otvori pismo" style="position: absolute; left: 50%; top: 56%; width: 76px; height: 76px; padding: 0; display: grid; place-items: center; border-radius: 50%; border: 2px solid #C9A7FF; background: #3E1D73; cursor: pointer;">
                <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.33-8.36C.9 9.9 2.2 6 5.8 5.2 8 4.7 10.2 5.7 12 7.6c1.8-1.9 4-2.9 6.2-2.4 3.6.8 4.9 4.7 3.13 7.44C18.7 16.65 12 21 12 21z" fill="#F3E8FF"/></svg>
              </button>
            </sc-if>
          </div>
          <p style="margin: 0; font-size: 14px; letter-spacing: 0.06em; color: #B9A8D9;">Klikni na pečat</p>
        </div>

        <sc-if value="{{opened}}" hint-placeholder-val="{{ false }}">
          <article class="bt-letter" style="grid-area: 1 / 1; position: relative; box-sizing: border-box; width: min(660px, 92vw); padding: clamp(32px, 5vw, 60px) clamp(28px, 5vw, 64px) clamp(28px, 4vw, 44px); border-radius: 8px; background: #F6F0FF; color: #2A1640; box-shadow: 0 40px 100px rgba(0,0,0,0.55), 0 0 0 1px rgba(201,167,255,0.4); display: flex; flex-direction: column; gap: 22px;">
            <svg aria-hidden="true" viewBox="-30 -30 60 60" style="position: absolute; right: 28px; top: 24px; width: 64px; height: 64px; opacity: 0.55;">
              <g fill="#C9A7FF"><ellipse cx="0" cy="-14" rx="6" ry="14"/><ellipse cx="0" cy="-14" rx="6" ry="14" transform="rotate(60)"/><ellipse cx="0" cy="-14" rx="6" ry="14" transform="rotate(120)"/><ellipse cx="0" cy="-14" rx="6" ry="14" transform="rotate(180)"/><ellipse cx="0" cy="-14" rx="6" ry="14" transform="rotate(240)"/><ellipse cx="0" cy="-14" rx="6" ry="14" transform="rotate(300)"/></g>
              <circle r="5" fill="#E8B4F0"/>
            </svg>

            <h1 class="bt-line" style="margin: 0; padding-right: 64px; font-family: 'Great Vibes', cursive; font-weight: 400; font-size: clamp(38px, 4.4vw, 50px); line-height: 1.1; color: #4A2580; animation-delay: 1.8s;">Draga moja Beba Tacije,</h1>

            <p class="bt-line" style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 19px; line-height: 1.7; color: #2A1640; text-wrap: pretty; animation-delay: 2.1s;">[Ovde ide tvoje pismo — ono što želiš da pročita kad prvi put upali svoj novi laptop.]</p>

            <p class="bt-line" style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 19px; line-height: 1.7; color: #5A3D86; text-wrap: pretty; animation-delay: 2.4s;">[Kako ste se upoznali, šta ti znači, šta te nasmeje kad pomisliš na nju.]</p>

            <div class="bt-line" style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; margin-top: 8px; animation-delay: 2.8s;">
              <span style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 18px; color: #2A1640;">Zauvek tvoj,</span>
              <span style="font-family: 'Great Vibes', cursive; font-size: 46px; line-height: 1.1; color: #4A2580;">Milan</span>
            </div>

            <div class="bt-line" style="display: flex; justify-content: center; animation-delay: 3.1s;">
              <button type="button" class="bt-close" onClick="{{close}}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid rgba(74,37,128,0.3); background: transparent; color: #4A2580; font-family: 'Manrope', system-ui, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;">Vrati pismo u kovertu</button>
            </div>
          </article>
        </sc-if>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const opened = !!(this.state && this.state.opened);
    return {
      opened,
      closed: !opened,
      envCls: opened ? 'bt-env-gone' : 'bt-env-idle',
      flapCls: opened ? 'bt-flap bt-flap-open' : 'bt-flap',
      open: () => this.setState({ opened: true }),
      close: () => this.setState({ opened: false })
    };
  }
}
</script>
</body>
</html>
